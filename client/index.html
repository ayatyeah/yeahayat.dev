<!doctype html>
<html lang="ru" >
  <head>
    <meta charset="UTF-8" />
    <script>try { document.documentElement.dataset.theme = localStorage.getItem('portfolio-theme') === 'dark' ? 'dark' : 'light' } catch {}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      if (location.pathname === '/') {
        const sky = document.createElement('link');
        sky.rel = 'preload';
        sky.as = 'image';
        sky.href = matchMedia('(max-width: 650px) and (max-resolution: 2dppx)').matches
          ? '/environment/ocean-descent-small.webp' : '/environment/ocean-descent.webp';
        sky.fetchPriority = 'high';
        document.head.append(sky);
      }
    </script>
    <meta
      name="description"
      content="YeahAyat — разработчик, который делает аккуратные веб-интерфейсы, backend и живые продукты."
    />
    <meta name="theme-color" content="#070b18" />
    <meta property="og:title" content="YeahAyat — Portfolio" />
    <meta property="og:description" content="Сайты и приложения, которые выглядят живыми и быстро работают." />
    <meta property="og:image" content="/logo_mark.png" />
    <meta property="og:type" content="website" />
    <title>YeahAyat — Portfolio</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
  </head>
  <body data-page="home">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
