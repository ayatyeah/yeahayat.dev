<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Контакты YeahAyat." />
    <title>YeahAyat - Контакты</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="logo_clean.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="contact">
    <canvas id="voidCanvas" class="void-canvas" aria-hidden="true"></canvas>
    <div class="noise-layer" aria-hidden="true"></div>
    <div class="scan-layer" aria-hidden="true"></div>
    <div class="cursor-aura" aria-hidden="true"></div>

    <div class="ya-transition" aria-hidden="true">
      <span class="ya-mark">YA</span>
      <span class="transition-line"></span>
    </div>

    <header class="header reveal" id="top">
      <a class="brand magnetic" href="index.html" data-nav-link="true" aria-label="На главную">
        <span class="brand-text">YeahAyat</span>
        <span class="brand-mark-wrap">
          <img class="brand-mark" src="logo_clean.png" alt="" />
        </span>
      </a>

      <nav class="nav-links" aria-label="Основная навигация">
        <a class="nav-link magnetic" href="index.html" data-nav-link="true">Главная</a>
        <a class="nav-link magnetic" href="projects.html" data-nav-link="true">Проекты</a>
        <a class="nav-link magnetic" href="github.html" data-nav-link="true">GitHub</a>
      </nav>
    </header>

    <main class="page-main">
      <section class="page-head reveal">
        <h1 class="page-title">Контакты</h1>
      </section>

      <section class="contact-board reveal" id="contact">
        <a class="contact-row magnetic" href="https://t.me/yeahayat" target="_blank" rel="noreferrer">
          <span>Telegram</span>
          <strong>@yeahayat</strong>
        </a>
        <a class="contact-row magnetic" href="mailto:balmagambet.ayat@gmail.com">
          <span>Email</span>
          <strong>balmagambet.ayat@gmail.com</strong>
        </a>
        <a class="contact-row magnetic" href="github.html" data-nav-link="true">
          <span>GitHub</span>
          <strong>посмотреть код</strong>
        </a>
      </section>

      <section class="form-shell reveal" aria-label="Форма обратной связи">
        <div class="form-head">
          <p class="panel-label">оставить заявку</p>
          <h2 class="form-heading">Расскажи о задаче — я отвечу в Telegram.</h2>
        </div>

        <form class="contact-form" id="contactForm" novalidate>
          <div class="form-grid">
            <label class="form-field">
              <span class="form-field-label">Имя</span>
              <input
                class="form-control"
                type="text"
                name="name"
                autocomplete="name"
                placeholder="Как тебя зовут"
                required
              />
            </label>
            <label class="form-field">
              <span class="form-field-label">Контакт для связи</span>
              <input
                class="form-control"
                type="text"
                name="contact"
                autocomplete="email"
                placeholder="@telegram, email или телефон"
                required
              />
            </label>
          </div>

          <label class="form-field">
            <span class="form-field-label">Сообщение</span>
            <textarea
              class="form-control form-textarea"
              name="message"
              rows="5"
              placeholder="О чём проект, сроки, бюджет, ссылки…"
              required
            ></textarea>
          </label>

          <div class="form-foot">
            <button class="btn btn-white form-submit magnetic" type="submit">
              <span class="form-submit-text">Отправить заявку</span>
            </button>
            <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
          </div>
        </form>
      </section>
    </main>

    <footer class="footer reveal">
      <p>© <span id="year"></span> YeahAyat</p>
    </footer>

    <script src="config.js"></script>
    <script type="module" src="script.js"></script>
  </body>
</html>
