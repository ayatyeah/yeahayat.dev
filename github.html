<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GitHub профиль YeahAyat." />
    <title>YeahAyat - GitHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="yeahayatdev_logo.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="github">
    <canvas id="voidCanvas" class="void-canvas" aria-hidden="true"></canvas>
    <div class="noise-layer" aria-hidden="true"></div>
    <div class="scan-layer" aria-hidden="true"></div>

    <div class="ya-transition" aria-hidden="true">
      <span class="ya-mark">YA</span>
      <span class="transition-line"></span>
    </div>

    <header class="header reveal" id="top">
      <a class="brand magnetic" href="index.html" data-nav-link="true" aria-label="На главную">
        <span class="brand-text">YeahAyat</span>
        <span class="brand-mark-wrap">
          <img class="brand-mark" src="yeahayat_logo_without name.png" alt="" />
        </span>
      </a>

      <nav class="nav-links" aria-label="Основная навигация">
        <a class="nav-link magnetic" href="index.html" data-nav-link="true">Главная</a>
        <a class="nav-link magnetic" href="projects.html" data-nav-link="true">Проекты</a>
        <a class="nav-link magnetic" href="contact.html" data-nav-link="true">Контакты</a>
      </nav>
    </header>

    <main class="page-main">
      <section class="page-head reveal">
        <h1 class="page-title">GitHub</h1>
      </section>

      <section class="contact-board reveal">
        <a class="contact-row magnetic contact-row-main" href="https://github.com/ayatyeah" target="_blank" rel="noreferrer">
          <span>Профиль</span>
          <strong>github.com/ayatyeah</strong>
        </a>
        <a class="contact-row magnetic" href="projects.html" data-nav-link="true">
          <span>Проекты</span>
          <strong>посмотреть работы</strong>
        </a>
      </section>
    </main>

    <footer class="footer reveal">
      <p>© <span id="year"></span> YeahAyat</p>
    </footer>

    <script type="module" src="script.js"></script>
  </body>
</html>
